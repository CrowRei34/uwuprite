name: Build Aseprite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Aseprite (Linux)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Aseprite con submódulos
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libxrandr-dev fuse libfuse2

      - name: Descargar Skia precompilado
        run: |
          mkdir -p skia
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip -q skia.zip -d skia

      - name: Configurar CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_UI=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(pwd)/../skia \
            -DSKIA_LIBRARY_DIR=$(pwd)/../skia/out/Release-x64 \
            -DSKIA_LIBRARY=$(pwd)/../skia/out/Release-x64/libskia.a

      - name: Compilar Aseprite
        run: |
          cd build
          ninja aseprite

      - name: Empaquetar como AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/bin/* AppDir/usr/bin/
          
          # Descargar linuxdeploy
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          
          # Preparar metadatos
          cat <<EOF > AppDir/aseprite.desktop
          [Desktop Entry]
          Name=Aseprite
          Exec=aseprite %U
          Icon=aseprite
          Type=Application
          Categories=Graphics;
          EOF
          cp data/icons/ase256.png AppDir/aseprite.png
          
          # Generar AppImage usando appimagetool y linuxdeploy
          # Usamos --appimage-extract por si falla FUSE en el runner de GitHub
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          OUTPUT=Aseprite-Linux.AppImage ./squashfs-root/AppRun --appdir AppDir -d AppDir/aseprite.desktop -i AppDir/aseprite.png --output appimage
          
          mkdir -p dist
          mv Aseprite-Linux.AppImage dist/

      - name: Subir artefacto AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-AppImage
          path: dist/
