name: Build Aseprite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Aseprite (Linux)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Aseprite con submódulos
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libxrandr-dev

      - name: Descargar Skia precompilado
        run: |
          mkdir -p skia
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip -q skia.zip -d skia

      - name: Configurar CMake
        run: |
          mkdir build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_UI=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(pwd)/../skia \
            -DSKIA_LIBRARY_DIR=$(pwd)/../skia/out/Release-x64 \
            -DSKIA_LIBRARY=$(pwd)/../skia/out/Release-x64/libskia.a

      - name: Compilar Aseprite
        run: |
          cd build
          ninja aseprite

      - name: Preparar artefacto compilado
        run: |
          mkdir -p dist
          cp -r build/bin/* dist/

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Linux
          path: dist/
