name: Build Aseprite

permissions:
  contents: write

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Rebuild weekly so the continuous release tracks upstream Aseprite.
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Build Aseprite (Linux)
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Aseprite con submódulos
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          path: aseprite
          submodules: recursive
          fetch-depth: 0

      - name: Checkout uwuprite
        uses: actions/checkout@v4
        with:
          path: uwuprite

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build desktop-file-utils libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev libxrandr-dev fuse libfuse2

      - name: Descargar Skia precompilado
        run: |
          cd aseprite
          mkdir -p skia
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
          unzip -q skia.zip -d skia

      - name: Configurar CMake
        run: |
          cd aseprite
          mkdir build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_UI=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$(pwd)/../skia \
            -DSKIA_LIBRARY_DIR=$(pwd)/../skia/out/Release-x64 \
            -DSKIA_LIBRARY=$(pwd)/../skia/out/Release-x64/libskia.a

      - name: Compilar Aseprite
        run: |
          cd aseprite/build
          ninja aseprite

      - name: Empaquetar binario para xbps-src
        run: |
          cd aseprite
          mkdir -p package/usr/bin \
            package/usr/share/applications \
            package/usr/share/icons/hicolor/256x256/apps \
            package/usr/share/licenses/uwuprite \
            dist

          install -Dm755 build/bin/aseprite package/usr/bin/uwuprite
          cp -a build/bin/data package/usr/bin/
          sed -e 's/^Exec=aseprite/Exec=uwuprite/' \
            -e 's/^TryExec=aseprite/TryExec=uwuprite/' \
            -e 's/^Icon=aseprite/Icon=uwuprite/' \
            -e 's/^StartupWMClass=Aseprite/StartupWMClass=uwuprite/' \
            src/desktop/linux/aseprite.desktop \
            > package/usr/share/applications/uwuprite.desktop
          desktop-file-validate package/usr/share/applications/uwuprite.desktop
          install -Dm644 data/icons/ase256.png \
            package/usr/share/icons/hicolor/256x256/apps/uwuprite.png
          install -Dm644 EULA.txt package/usr/share/licenses/uwuprite/EULA.txt

          tar -cJf dist/uwuprite-x86_64.tar.xz -C package usr
          sha256sum dist/uwuprite-x86_64.tar.xz \
            > dist/uwuprite-x86_64.tar.xz.sha256

      - name: Actualizar template de xbps-src
        if: github.event_name != 'pull_request'
        run: |
          checksum=$(cut -d ' ' -f 1 aseprite/dist/uwuprite-x86_64.tar.xz.sha256)
          build_version="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          template=uwuprite/srcpkgs/uwuprite/template

          sed -i -E "s/^version=.*/version=${build_version}/" "$template"
          sed -i -E 's/^revision=.*/revision=1/' "$template"
          sed -i -E "s/^checksum=.*/checksum=${checksum}/" "$template"

          git -C uwuprite config user.name "github-actions[bot]"
          git -C uwuprite config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C uwuprite add srcpkgs/uwuprite/template
          if ! git -C uwuprite diff --cached --quiet; then
            git -C uwuprite commit -m "chore: update prebuilt uwuprite ${build_version} [skip ci]"
            git -C uwuprite push origin HEAD:main
          fi

      - name: Empaquetar como AppImage
        run: |
          cd aseprite
          mkdir -p AppDir/usr/bin
          cp -r build/bin/* AppDir/usr/bin/
          
          # Descargar linuxdeploy
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage
          
          # Preparar metadatos
          cat <<EOF > AppDir/aseprite.desktop
          [Desktop Entry]
          Name=Aseprite
          Exec=aseprite %U
          Icon=aseprite
          Type=Application
          Categories=Graphics;
          EOF
          cp data/icons/ase256.png AppDir/aseprite.png
          
          # Generar AppImage usando appimagetool y linuxdeploy
          # Usamos --appimage-extract por si falla FUSE en el runner de GitHub
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          OUTPUT=Aseprite-Linux.AppImage ./squashfs-root/AppRun --appdir AppDir -d AppDir/aseprite.desktop -i AppDir/aseprite.png --output appimage
          
          mkdir -p dist
          mv Aseprite-Linux.AppImage dist/

      - name: Subir artefacto AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-AppImage
          path: aseprite/dist/

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        with:
          tag_name: continuous
          name: Última compilación precompilada
          files: |
            aseprite/dist/Aseprite-Linux.AppImage
            aseprite/dist/uwuprite-x86_64.tar.xz
            aseprite/dist/uwuprite-x86_64.tar.xz.sha256
          prerelease: false
